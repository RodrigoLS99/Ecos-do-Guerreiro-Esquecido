name: Compilar e Exportar Jogo

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    name: Exportar Godot 4
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Exportar com Godot 4
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          cache: true

      - name: Upload dos Artefatos de Build
        uses: actions/upload-artifact@v4
        with:
          name: Ecos-do-Guerreiro-Esquecido-Builds
          path: |
            ${{ steps.export.outputs.build_directory }}/**/*.x86_64
            ${{ steps.export.outputs.build_directory }}/**/*.exe
          if-no-files-found: warn

      - name: Criar Release no GitHub (Tags apenas)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.export.outputs.build_directory }}/**/*.x86_64
            ${{ steps.export.outputs.build_directory }}/**/*.exe
          draft: false
          prerelease: false
