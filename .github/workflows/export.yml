name: Compilar e Exportar Jogo

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export:
    name: Exportar Godot 4
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Exportar com Godot 4
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true

      - name: Upload dos Artefatos de Build
        uses: actions/upload-artifact@v4
        with:
          name: Ecos-do-Guerreiro-Esquecido-Builds
          path: |
            /home/runner/.local/share/godot/builds/**
          if-no-files-found: warn

      - name: Criar Release no GitHub (Tags apenas)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /home/runner/.local/share/godot/builds/**/*.zip
          draft: false
          prerelease: false
