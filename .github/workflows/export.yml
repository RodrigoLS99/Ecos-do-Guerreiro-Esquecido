name: Compilar e Exportar Jogo

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  LINUX_BIN: "builds/linux/Ecos do Guerreiro Esquecido.x86_64"
  WINDOWS_BIN: "builds/windows/Ecos do Guerreiro Esquecido.exe"
  WEB_DIR: "builds/web"

jobs:
  export:
    name: Exportar Multiplataforma (Linux, Windows, Web)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v7

      - name: Criar Diretórios de Build
        run: |
          mkdir -p builds/linux
          mkdir -p builds/windows
          mkdir -p builds/web
          mkdir -p release_assets

      - name: Exportar com Godot 4
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          cache: true

      - name: Preparar Assets de Release
        run: |
          set -eu
          BUILD_DIR="${{ steps.export.outputs.build_directory }}"
          echo "Diretório de build exportado: $BUILD_DIR"
          mkdir -p release_assets

          # 1. Linux
          if [ -f "$BUILD_DIR/$LINUX_BIN" ]; then
            cp "$BUILD_DIR/$LINUX_BIN" "release_assets/Ecos do Guerreiro Esquecido - Linux.x86-64"
          elif [ -f "$LINUX_BIN" ]; then
            cp "$LINUX_BIN" "release_assets/Ecos do Guerreiro Esquecido - Linux.x86-64"
          else
            LINUX_SRC=$(find "$BUILD_DIR" ./builds -type f \( -name "*.x86_64" -o -name "*.x86-64" \) | head -n 1)
            cp "$LINUX_SRC" "release_assets/Ecos do Guerreiro Esquecido - Linux.x86-64"
          fi

          # 2. Windows
          if [ -f "$BUILD_DIR/$WINDOWS_BIN" ]; then
            cp "$BUILD_DIR/$WINDOWS_BIN" "release_assets/Ecos do Guerreiro Esquecido - Windows.exe"
          elif [ -f "$WINDOWS_BIN" ]; then
            cp "$WINDOWS_BIN" "release_assets/Ecos do Guerreiro Esquecido - Windows.exe"
          else
            WIN_SRC=$(find "$BUILD_DIR" ./builds -type f -name "*.exe" | head -n 1)
            cp "$WIN_SRC" "release_assets/Ecos do Guerreiro Esquecido - Windows.exe"
          fi

          # 3. Web
          if [ -d "$BUILD_DIR/$WEB_DIR" ] && [ "$(find "$BUILD_DIR/$WEB_DIR" -type f | wc -l)" -gt 0 ]; then
            (cd "$BUILD_DIR/$WEB_DIR" && zip -rq "$GITHUB_WORKSPACE/release_assets/Ecos do Guerreiro Esquecido - Web.zip" .)
          elif [ -d "$WEB_DIR" ] && [ "$(find "$WEB_DIR" -type f | wc -l)" -gt 0 ]; then
            (cd "$WEB_DIR" && zip -rq "$GITHUB_WORKSPACE/release_assets/Ecos do Guerreiro Esquecido - Web.zip" .)
          else
            WEB_SRC=$(find "$BUILD_DIR" ./builds -type d \( -name "*web*" -o -name "*Web*" \) | head -n 1)
            (cd "$WEB_SRC" && zip -rq "$GITHUB_WORKSPACE/release_assets/Ecos do Guerreiro Esquecido - Web.zip" .)
          fi

          echo "Conteúdo final de release_assets:"
          ls -la release_assets/

      - name: Upload dos Artefatos de Build
        uses: actions/upload-artifact@v7
        with:
          name: Ecos-do-Guerreiro-Esquecido-Builds
          path: release_assets/*
          if-no-files-found: error

      - name: Publicar Release no GitHub (Tags apenas)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release_assets/Ecos do Guerreiro Esquecido - Linux.x86-64
            release_assets/Ecos do Guerreiro Esquecido - Windows.exe
            release_assets/Ecos do Guerreiro Esquecido - Web.zip
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-pre') }}
          generate_release_notes: true
